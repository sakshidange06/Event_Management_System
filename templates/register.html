{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 420px;">
  <div class="card-body p-4">
    <h4 class="mb-3">Create Account</h4>
    <form method="post">
      <div class="mb-3"><label class="form-label">Full Name</label>
        <input name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" minlength="4" required></div>
      <button class="btn btn-success w-100">Register</button>
    </form>
    <p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
{% endblock %}
